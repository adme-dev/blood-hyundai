# Global headers
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
[build]
  functions = "src/functions"

  [[redirects]]
from = "/carsales-feed"
to = "/.netlify/functions/carsales-feed"
status = 200

[[redirects]]
  from = "/facebook-api"
  to = "/.netlify/functions/facebook-api"
  status = 200
[[redirects]]
  from = "/google-api"
  to = "/.netlify/functions/google-api"
  status = 200

  [[redirects]]
  from = "/fetchReviews"
  to = "/.netlify/functions/fetchReviews"
  status = 200

# Redirect all requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# netlify.toml
[[headers]]
  # Cache policy for HTML documents: No caching
  for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Cache policy for images and fonts: Long-term caching
  for = "/images/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache policy for JavaScript and CSS: Versioned files benefit from long-term caching
  for = "/js/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
